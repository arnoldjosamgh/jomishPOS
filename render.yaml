# render.yaml — JomishPOS Deployment Configuration
# Deploy to Render.com by linking your GitHub repo (arnoldjosamgh/jomishPOS)
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: jomish-pos
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: node backend/server.js
    healthCheckPath: /api/system/status

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_wfOXbnA3i0JY@ep-raspy-thunder-ayuhx4hs-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
